name: Validate worker lifecycle and isolation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: bash -n .github/scripts/bootstrap.sh
      - run: python3 tests/test_worker.py
      - run: python3 tests/test_checkpoints.py
